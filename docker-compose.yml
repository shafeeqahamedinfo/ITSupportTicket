version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: smartcampus_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: smartcampus_itcare
    volumes:
      - mongo_data:/data/db

  # Node.js Express Backend Service
  backend:
    build: ./server
    container_name: smartcampus_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/smartcampus_itcare
      JWT_SECRET: SmartCampus_ITCare_Production_Secret_2026!
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb

volumes:
  mongo_data:
